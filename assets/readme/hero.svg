<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">瞬变工坊 MomentShift</title>
  <desc id="hero-desc">拖进去，选格式，批量转的本地多媒体工具箱：ffmpeg 转换 / 压缩，离线 AI 超分放大、视频插帧与语音转文字。右侧为转换队列界面的简化示意：MP4 转换中、PNG 已完成、WAV 排队中。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- 背景面板：与应用一致的浅色表面 -->
  <rect width="1200" height="320" rx="26" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>

  <!-- ======================= 左：标题块 ======================= -->
  <g id="title-block" transform="translate(64 40)">
    <text class="sans" x="0" y="16" font-size="20" fill="#656D76">ffmpeg 多媒体工具箱 · 离线 AI 推理</text>

    <text class="sans" x="0" y="82" font-size="62" font-weight="700" fill="#1F2328">瞬变工坊</text>
    <text class="sans" x="0" y="128" font-size="40" font-weight="600" fill="#1F883D" letter-spacing="0.5">MomentShift</text>

    <text class="sans" x="0" y="166" font-size="22" font-weight="500" fill="#1F2328">拖进去，选格式，批量转。</text>
    <text class="sans" x="0" y="196" font-size="20" fill="#656D76">本地离线 AI：超分放大 / 视频插帧 / 语音转文字</text>

    <!-- 格式徽标行（与应用内格式徽标同一母题） -->
    <g id="format-chips" transform="translate(0 216)" class="mono" font-size="18" font-weight="600">
      <g transform="translate(0 0)"><rect width="58" height="28" rx="6" fill="#EDF5F0"/><text x="29" y="20" text-anchor="middle" fill="#1A7F37">MP4</text></g>
      <g transform="translate(66 0)"><rect width="58" height="28" rx="6" fill="#EDF5F0"/><text x="29" y="20" text-anchor="middle" fill="#1A7F37">MKV</text></g>
      <g transform="translate(132 0)"><rect width="58" height="28" rx="6" fill="#EDF5F0"/><text x="29" y="20" text-anchor="middle" fill="#1A7F37">PNG</text></g>
      <g transform="translate(198 0)"><rect width="58" height="28" rx="6" fill="#EDF5F0"/><text x="29" y="20" text-anchor="middle" fill="#1A7F37">JPG</text></g>
      <g transform="translate(264 0)"><rect width="54" height="28" rx="6" fill="#EDF5F0"/><text x="27" y="20" text-anchor="middle" fill="#1A7F37">GIF</text></g>
      <g transform="translate(326 0)"><rect width="58" height="28" rx="6" fill="#EDF5F0"/><text x="29" y="20" text-anchor="middle" fill="#1A7F37">MP3</text></g>
      <g transform="translate(392 0)"><rect width="64" height="28" rx="6" fill="#EDF5F0"/><text x="32" y="20" text-anchor="middle" fill="#1A7F37">FLAC</text></g>
      <g transform="translate(464 0)"><rect width="70" height="28" rx="6" fill="#EDF5F0"/><text x="35" y="20" text-anchor="middle" fill="#1A7F37">WEBM</text></g>
    </g>

    <text class="mono" x="0" y="270" font-size="18" fill="#656D76">v0.9.2 · GPL-3.0 · Windows / macOS / Linux</text>
  </g>

  <!-- ======================= 右：转换队列卡（应用界面的简化示意） ======================= -->
  <g id="queue-card" transform="translate(756 32)">
    <rect width="380" height="256" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>

    <!-- 卡头：标题 + 统计圆点（与队列统计栏同源） -->
    <text class="sans" x="20" y="32" font-size="18" font-weight="700" fill="#1F2328">转换队列</text>
    <circle cx="304" cy="26" r="4" fill="#8A8A8A"/>
    <circle cx="322" cy="26" r="4" fill="#2F98FF"/>
    <circle cx="340" cy="26" r="4" fill="#CF222E"/>
    <line x1="20" y1="46" x2="360" y2="46" stroke="#EAEFF2" stroke-width="1"/>

    <!-- 行 1：MP4 转换中（进度 62%） -->
    <g transform="translate(20 58)">
      <rect width="46" height="24" rx="4" fill="#EDF5F0"/>
      <text class="mono" x="23" y="17" text-anchor="middle" font-size="15" font-weight="700" fill="#1A7F37">MP4</text>
      <rect x="58" y="7" width="150" height="10" rx="5" fill="#EAEFF2"/>
      <rect x="58" y="27" width="192" height="4" rx="2" fill="#EAEFF2"/>
      <rect x="58" y="27" width="119" height="4" rx="2" fill="#1F883D"/>
      <rect x="264" y="0" width="76" height="24" rx="9" fill="#2F98FF"/>
      <text class="sans" x="302" y="17" text-anchor="middle" font-size="15" fill="#FFFFFF">转换中</text>
    </g>

    <!-- 行 2：PNG 已完成 -->
    <g transform="translate(20 110)">
      <rect width="46" height="24" rx="4" fill="#EDF5F0"/>
      <text class="mono" x="23" y="17" text-anchor="middle" font-size="15" font-weight="700" fill="#1A7F37">PNG</text>
      <rect x="58" y="7" width="118" height="10" rx="5" fill="#EAEFF2"/>
      <rect x="264" y="0" width="76" height="24" rx="9" fill="#3EB68F"/>
      <text class="sans" x="302" y="17" text-anchor="middle" font-size="15" fill="#FFFFFF">已完成</text>
    </g>

    <!-- 行 3：WAV 排队中 -->
    <g transform="translate(20 162)">
      <rect width="46" height="24" rx="4" fill="#EDF5F0"/>
      <text class="mono" x="23" y="17" text-anchor="middle" font-size="15" font-weight="700" fill="#1A7F37">WAV</text>
      <rect x="58" y="7" width="136" height="10" rx="5" fill="#EAEFF2"/>
      <rect x="264" y="0" width="76" height="24" rx="9" fill="#8A8A8A"/>
      <text class="sans" x="302" y="17" text-anchor="middle" font-size="15" fill="#FFFFFF">排队中</text>
    </g>

    <!-- 卡尾：控制条（与应用队列控制条同构） -->
    <line x1="20" y1="212" x2="360" y2="212" stroke="#EAEFF2" stroke-width="1"/>
    <rect x="20" y="222" width="84" height="24" rx="6" fill="#1F883D"/>
    <text class="sans" x="62" y="239" text-anchor="middle" font-size="16" fill="#FFFFFF">开始</text>
    <rect x="264" y="222" width="64" height="24" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
    <text class="sans" x="296" y="239" text-anchor="middle" font-size="16" fill="#656D76">暂停</text>
    <rect x="336" y="222" width="0" height="0" fill="none"/>
    <text class="sans" x="360" y="239" text-anchor="end" font-size="16" fill="#656D76">清空</text>
  </g>
</svg>
