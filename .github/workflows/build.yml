name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------
  # Windows build (primary target).
  # Produces BOTH a portable zip (绿色解压版) and an NSIS installer (安装包),
  # then attaches both to the GitHub Release on a tag push.
  # ----------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      - name: Package portable artifact
        run: |
          cd dist
          Compress-Archive -Path MomentShift -DestinationPath MomentShift-Windows-Portable.zip

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        run: makensis installer.nsi

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-Windows-Portable
          path: dist/MomentShift-Windows-Portable.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-Windows-Setup
          path: MomentShift-Windows-Setup.exe

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }} (测试版)
          fail_on_unmatched_files: false
          files: |
            dist/MomentShift-Windows-Portable.zip
            MomentShift-Windows-Setup.exe

  # ----------------------------------------------------------------------
  # macOS build (best-effort). continue-on-error keeps the Windows release
  # intact even if this job fails. Runs after Windows so the release already
  # exists and this job just appends its asset.
  # ----------------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: build-windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller build.spec

      - name: Package artifact
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MomentShift MomentShift-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-macOS
          path: dist/MomentShift-macOS.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }} (测试版)
          fail_on_unmatched_files: false
          files: dist/MomentShift-macOS.zip

  # ----------------------------------------------------------------------
  # Linux build (best-effort). Same pattern as macOS.
  # ----------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: build-macos
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libgl1 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller build.spec

      - name: Package artifact
        run: |
          cd dist
          zip -r MomentShift-Linux.zip MomentShift

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-Linux
          path: dist/MomentShift-Linux.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }} (测试版)
          fail_on_unmatched_files: false
          files: dist/MomentShift-Linux.zip
