name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------
  # Windows build (primary target). Produces MomentShift-Windows.zip and,
  # on a tag, attaches it to a GitHub Release.
  # ----------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      - name: Package artifact
        run: |
          cd dist
          Compress-Archive -Path MomentShift -DestinationPath MomentShift-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-Windows
          path: dist/MomentShift-Windows.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MomentShift-Windows.zip

