name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------
  # Windows build (primary target).
  # Produces:
  #   - Standard portable zip (不含 ffmpeg，用户自行下载)
  #   - Full portable zip (自带 ffmpeg)
  #   - NSIS installer
  # ----------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      - name: Package standard portable
        run: |
          cd dist
          Compress-Archive -Path MomentShift -DestinationPath MomentShift-Windows-Portable.zip

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ffmpegDir = "dist\MomentShift\ffmpeg"
          New-Item -ItemType Directory -Path $ffmpegDir -Force | Out-Null
          
          # Download ffmpeg from gyan.dev (essentials build)
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "$env:TEMP\ffmpeg.zip"
          
          Write-Host "Downloading FFmpeg..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 120
          
          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path $zip -DestinationPath $env:TEMP\ffmpeg_extract -Force
          
          # Find the bin directory
          $binDir = Get-ChildItem -Path $env:TEMP\ffmpeg_extract -Filter "bin" -Recurse -Directory | Select-Object -First 1
          if ($binDir) {
            Copy-Item "$($binDir.FullName)\ffmpeg.exe" -Destination $ffmpegDir -Force
            Copy-Item "$($binDir.FullName)\ffprobe.exe" -Destination $ffmpegDir -Force
            Write-Host "FFmpeg files copied to $ffmpegDir"
          } else {
            Write-Warning "Could not find bin directory in FFmpeg archive"
          }
          
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $env:TEMP\ffmpeg_extract -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package full portable
        run: |
          cd dist
          Compress-Archive -Path MomentShift -DestinationPath MomentShift-Windows-Full.zip

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = Get-ChildItem -Path "C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS" -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            choco install nsis -y
            $nsis = Get-ChildItem -Path "C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS" -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $nsis) { throw "makensis.exe not found after install" }
          $nsisDir = Split-Path $nsis.FullName
          echo "$nsisDir" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          & $nsis.FullName installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

      - name: Upload standard portable
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-Windows-Portable
          path: dist/MomentShift-Windows-Portable.zip

      - name: Upload full portable
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-Windows-Full
          path: dist/MomentShift-Windows-Full.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-Windows-Setup
          path: MomentShift-Windows-Setup.exe

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          overwrite: true
          name: ${{ github.ref_name }} (测试版)
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: |
            dist/MomentShift-Windows-Portable.zip
            dist/MomentShift-Windows-Full.zip
            MomentShift-Windows-Setup.exe

  # ----------------------------------------------------------------------
  # macOS build (best-effort)
  # ----------------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: build-windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller build.spec

      - name: Package artifact
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MomentShift MomentShift-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-macOS
          path: dist/MomentShift-macOS.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          overwrite: true
          name: ${{ github.ref_name }} (测试版)
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: dist/MomentShift-macOS.zip

  # ----------------------------------------------------------------------
  # Linux build (best-effort)
  # ----------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: build-macos
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libgl1 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller build.spec

      - name: Package artifact
        run: |
          cd dist
          zip -r MomentShift-Linux.zip MomentShift

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MomentShift-Linux
          path: dist/MomentShift-Linux.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          overwrite: true
          name: ${{ github.ref_name }} (测试版)
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: dist/MomentShift-Linux.zip
